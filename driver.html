<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ray's Taxi Driver</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="manifest" href="driver-manifest.webmanifest">
<link rel="apple-touch-icon" href="pwa-icon-192.png">
<meta name="theme-color" content="#101820">

</head>

<body class="driver-page">

<div id="requests">

    <header class="dashboard-heading">
        <div>
            <h1>🚖 Ray's Taxi Driver</h1>
            <p id="mapStatus" class="dashboard-map-status">Loading driver dashboard…</p>
        </div>
        <div class="device-mode-controls">
            <a class="device-mode drive-mode-link" href="driver-map.html">🚗 Drive mode</a>
            <a class="device-mode history-link" href="history.html">📋 History</a>
            <button id="logoutButton" class="device-mode logout-button" type="button">↪ Log out</button>
        </div>
    </header>

    <section class="service-control" aria-label="Customer service message">
        <div>
            <h2>📣 Customer status</h2>
            <p>Short update shown on the booking page.</p>
        </div>
        <label class="service-availability">
            <input id="serviceAvailable" type="checkbox" checked>
            Taking requests
        </label>
        <textarea id="serviceMessage" maxlength="140" rows="2" placeholder="Example: 🚕 Out on charter until 4 PM"></textarea>
        <button id="saveServiceStatus" class="save-service-status" type="button">Save customer status</button>
        <p id="serviceStatusSaved" class="service-status-saved" aria-live="polite"></p>
    </section>

    <section class="dashboard-map-panel">
        <div id="driverMap" aria-label="Live pickup map"></div>
        <p class="map-note">Pins appear before acceptance. GPS comes from the BLY RIDE Beacon app.</p>
        <button id="centerDriver" class="center-driver" type="button">📍 My location</button>
    </section>

    <section class="dashboard-requests">
        <h2>Ride requests</h2>
        <div id="requestList"><p>Waiting for requests...</p></div>
    </section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="driver.js"></script>
<script src="pwa.js"></script>

</body>

</html>
