<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ray's Taxi</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#101820;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{

    width:90%;
    max-width:380px;

    background:#1d2939;

    border-radius:18px;

    padding:30px;

    box-sizing:border-box;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.4);

}

.logo{

    font-size:60px;

}

h1{

    margin-top:10px;
    margin-bottom:5px;

}

p{

    color:#c7c7c7;
    line-height:1.5;

}

input{

    width:100%;
    padding:15px;
    font-size:17px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
    margin-top:20px;

}

button{

    width:100%;

    margin-top:20px;

    padding:16px;

    border:none;

    border-radius:10px;

    background:#fdd017;

    color:black;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

button:disabled{

    background:#555;

    color:#aaa;

    cursor:not-allowed;

}

#status{

    margin-top:20px;

    font-size:15px;

    line-height:1.6;

}

.small{

    font-size:12px;

    color:#888;

    margin-top:15px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">🚕</div>

<h1>Ray's Taxi</h1>

<p><b>Your driver is locating your pickup position.</b></p>

<input
id="customerName"
type="text"
placeholder="Passenger's Name">

<button id="sendButton" disabled>

📡 Finding Location...

</button>

<div id="status">

Requesting GPS permission...

</div>

<div class="small">

Please allow location access when prompted.

</div>

</div>

<script>

const phone="5927563720";

const button=document.getElementById("sendButton");

const status=document.getElementById("status");

let latitude="";
let longitude="";
let accuracy=0;

window.onload=function(){

    getLocation();

};

function getLocation(){

    status.style.color="white";

    status.innerHTML="📡 Finding your GPS location...";

    if(!navigator.geolocation){

        status.innerHTML="❌ Your browser does not support GPS.";

        return;

    }

    navigator.geolocation.getCurrentPosition(

        success,

        error,

        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:0

        }

    );

}

function success(position){

    let gpsStatus = "";
let gpsColor = "";

if (accuracy <= 4) {
    gpsStatus = "🟢 Excellent";
    gpsColor = "#00ff88";
}
else if (accuracy <= 10) {
    gpsStatus = "🟡 Good";
    gpsColor = "#ffd700";
}
else if (accuracy <= 20) {
    gpsStatus = "🟠 Fair";
    gpsColor = "#ff9800";
}
else {
    gpsStatus = "🔴 Weak";
    gpsColor = "#ff4444";
}

status.style.color = gpsColor;

status.innerHTML = `
<b>${gpsStatus} GPS Signal</b>

<br><br>

Accuracy:
<b>${accuracy} meters</b>
`;

button.disabled = false;
button.innerHTML = "🚖 Send Taxi Request";
}

function sendWhatsApp(){

    const passenger=document.getElementById("customerName").value.trim();

    if(passenger===""){

        alert("Please enter the passenger's name.");

        return;

    }

    const mapsLink=`https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}`;

    let warning="";

if(accuracy>20){

warning=`

GPS signal is weak.

Please reply with a nearby landmark photo if possible.`;


    }

    const message=encodeURIComponent(

`🚖 Ray's Taxi Pickup Request

👤 Passenger's Name:
${passenger}

📍 Google Maps:
${mapsLink}

GPS Signal:
${gpsStatus}

Accuracy:
${accuracy} meters

);

    window.location.href=`https://wa.me/${phone}?text=${message}`;

}

function error(err){

    status.style.color="#ff6666";

    switch(err.code){

        case err.PERMISSION_DENIED:

            status.innerHTML="❌ Location permission denied.";

            break;

        case err.POSITION_UNAVAILABLE:

            status.innerHTML="❌ GPS unavailable.";

            break;

        case err.TIMEOUT:

            status.innerHTML="❌ GPS request timed out.";

            break;

        default:

            status.innerHTML="❌ Unknown GPS error.";

    }

}

button.addEventListener("click",sendWhatsApp);

</script>

</body>

</html>
