<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ray's Taxi</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#101820;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{

    width:90%;
    max-width:380px;

    background:#1d2939;

    border-radius:18px;

    padding:30px;

    box-sizing:border-box;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.4);

}

.logo{

    font-size:60px;

}

h1{

    margin-top:10px;
    margin-bottom:5px;

}

p{

    color:#c7c7c7;
    line-height:1.5;

}

button{

    width:100%;

    margin-top:25px;

    padding:16px;

    border:none;

    border-radius:10px;

    background:#bdf516;

    color:black;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

button:disabled{

    background:#555;

    color:#aaa;

}

#status{

    margin-top:20px;

    font-size:15px;

}

.small{

    font-size:12px;

    color:#888;

    margin-top:15px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">🚖</div>

<h1>Ray's Taxi</h1>

<p>

Tap the button below to send us your pickup location :).

</p>

<button id="sendButton">

BOOK A RIDE

</button>

<div id="status"></div>

<div class="small">

Location permission is required.

</div>

</div>

<script>

const phone="5927563720";

const button=document.getElementById("sendButton");

const status=document.getElementById("status");

button.addEventListener("click",getLocation);

function getLocation(){

button.disabled=true;

status.style.color="white";

status.innerHTML="📡 Finding your GPS location...";

if(!navigator.geolocation){

status.innerHTML="Your browser does not support GPS.";

button.disabled=false;

return;

}

navigator.geolocation.getCurrentPosition(success,error,{

enableHighAccuracy:true,

timeout:10000,

maximumAge:10000

});

}

function success(position){

const lat=position.coords.latitude;

const lon=position.coords.longitude;

const accuracy=Math.round(position.coords.accuracy);

const mapsLink=`https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;

const message=encodeURIComponent(

`🚖Ray's Taxi Pickup Request

📍 Google Maps:
${mapsLink}

Latitude:
${lat}

Longitude:
${lon}

GPS Accuracy:
${accuracy} meters`

);

const whatsapp=`https://wa.me/${phone}?text=${message}`;

status.style.color="#00ff88";

status.innerHTML=`
✅ Location Found

<br><br>

Accuracy: ${accuracy} meters

<br><br>

Opening WhatsApp...
`;

setTimeout(()=>{

window.location.href=whatsapp;

button.disabled=false;

},1200);

}

function error(err){

button.disabled=false;

status.style.color="#ff6666";

switch(err.code){

case err.PERMISSION_DENIED:

status.innerHTML="❌ Location permission denied.";

break;

case err.POSITION_UNAVAILABLE:

status.innerHTML="❌ GPS unavailable.";

break;

case err.TIMEOUT:

status.innerHTML="❌ GPS timed out.";

break;

default:

status.innerHTML="❌ Unknown error.";

}

}

</script>

</body>
</html>
